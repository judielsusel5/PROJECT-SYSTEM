<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory | Annroe's Flower Shop Admin</title>
  <link rel="icon" href="../assets/images/branding/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
  <link href="../assets/css/responsive.css" rel="stylesheet">
  <script>
    try { if (localStorage.getItem('annerore_admin_theme') === 'dark') { document.documentElement.setAttribute('data-theme','dark'); document.documentElement.setAttribute('data-bs-theme','dark'); } } catch (e) {}
  </script>
</head>
<body data-page="inventory" data-title="Inventory">
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <div class="admin-shell">
    <aside id="adminSidebar" class="admin-sidebar" aria-label="Sidebar"></aside>
    <div id="sidebarOffcanvas"></div>
    <div class="admin-main">
      <header id="adminTopbar"></header>
      <main id="mainContent" class="admin-content" tabindex="-1">
        <div id="pageHeader"></div>

        <div class="ar-demo-note" role="note">
          <i class="bi bi-info-circle" aria-hidden="true"></i>
          <div>Sample stock data. Stock cannot be reduced below zero.</div>
        </div>

        <section aria-label="Stock summary" class="row g-3 mb-4" id="invStats"></section>

        <section class="ar-card mb-4" aria-labelledby="alertTitle">
          <div class="ar-card-header"><h2 class="ar-card-title" id="alertTitle">Low-stock alerts</h2></div>
          <div id="invAlerts"></div>
        </section>

        <section class="ar-card mb-4" aria-labelledby="invTitle">
          <div class="ar-card-header">
            <h2 class="ar-card-title" id="invTitle">Flower stock</h2>
            <span class="small text-muted" id="invCount" aria-live="polite"></span>
          </div>
          <form class="ar-filter-bar" role="search" aria-label="Filter inventory" onsubmit="return false">
            <div class="ar-grow">
              <label class="form-label" for="invSearch">Search</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
                <input id="invSearch" type="search" class="form-control" placeholder="Name, ID, flower or color" autocomplete="off">
              </div>
            </div>
            <div>
              <label class="form-label" for="invStatus">Stock status</label>
              <select id="invStatus" class="form-select">
                <option value="">All statuses</option>
                <option>In Stock</option>
                <option>Low Stock</option>
                <option>Out of Stock</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="invSort">Sort by</label>
              <select id="invSort" class="form-select">
                <option value="name">Name (A–Z)</option>
                <option value="attention">Needs attention first</option>
                <option value="stock-asc">Stock (low to high)</option>
                <option value="stock-desc">Stock (high to low)</option>
              </select>
            </div>
            <div class="flex-grow-0">
              <button type="button" class="btn btn-outline-primary w-100" id="invClear"><i class="bi bi-x-circle me-1" aria-hidden="true"></i>Clear</button>
            </div>
          </form>
          <div class="ar-table-wrap" id="invTable"></div>
        </section>

        <section class="ar-card" id="historyCard" aria-labelledby="histTitle">
          <div class="ar-card-header">
            <h2 class="ar-card-title" id="histTitle" tabindex="-1">Stock movement history</h2>
            <span class="small text-muted" id="histCount" aria-live="polite"></span>
          </div>
          <form class="ar-filter-bar" role="search" aria-label="Filter stock history" onsubmit="return false">
            <div class="ar-grow">
              <label class="form-label" for="histProduct">Product</label>
              <select id="histProduct" class="form-select"></select>
            </div>
            <div>
              <label class="form-label" for="histType">Movement type</label>
              <select id="histType" class="form-select">
                <option value="">All types</option>
                <option>Addition</option>
                <option>Reduction</option>
                <option>Spoilage/Damaged</option>
                <option>Adjustment</option>
              </select>
            </div>
            <div class="flex-grow-0">
              <button type="button" class="btn btn-outline-primary w-100" id="histClear"><i class="bi bi-x-circle me-1" aria-hidden="true"></i>Clear</button>
            </div>
          </form>
          <div class="ar-table-wrap" id="histTable"></div>
          <div class="text-center p-3" id="histMoreWrap" hidden>
            <button type="button" class="btn btn-outline-primary" id="histMore">Show more</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Adjust stock -->
  <div class="modal fade" id="adjustModal" tabindex="-1" aria-labelledby="adjustTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <form class="modal-content" id="adjustForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="adjustTitle">Adjust stock</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="adProduct">Product *</label>
            <select class="form-select" id="adProduct" required></select>
            <div class="invalid-feedback"></div>
            <div class="form-text" id="adCurrent" aria-live="polite"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="adType">What happened? *</label>
            <select class="form-select" id="adType">
              <option value="Addition">Add stock (flowers received)</option>
              <option value="Reduction">Reduce stock (used or sold)</option>
              <option value="Spoilage/Damaged">Spoilage or damaged flowers</option>
              <option value="Adjustment">Set exact count (stock count correction)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="adQty" id="adQtyLabel">Quantity *</label>
            <input type="number" class="form-control" id="adQty" min="0" step="1" inputmode="numeric" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="adReason">Reason *</label>
            <input type="text" class="form-control" id="adReason" list="reasonList" maxlength="120" autocomplete="off" required>
            <datalist id="reasonList"></datalist>
            <div class="invalid-feedback"></div>
            <div class="form-text">Type your own or pick a suggestion.</div>
          </div>
          <div class="ar-preview" id="adPreview" aria-live="polite"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="adSave">Save adjustment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-common.js"></script>
  <script src="../assets/js/admin-data.js"></script>
  <script src="../assets/js/admin-inventory.js"></script>
</body>
</html>
